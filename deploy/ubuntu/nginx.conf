# Install in sites-available only after obtaining the certificate.
limit_req_zone $binary_remote_addr zone=centralcrm_login:10m rate=10r/m;

server {
    listen 80;
    server_name crm.edulearnntech.in;
    location /.well-known/acme-challenge/ { root /var/www/centralcrm/acme; }
    location / { return 301 https://crm.edulearnntech.in$request_uri; }
}

server {
    listen 443 ssl;
    server_name crm.edulearnntech.in;
    ssl_certificate /etc/letsencrypt/live/crm.edulearnntech.in/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/crm.edulearnntech.in/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    server_tokens off;
    client_max_body_size 2m;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy same-origin always;

    location /static/ { alias /var/www/centralcrm/static/; }
    location ~ ^/(api/v1/auth/login/?|admin/login/?)$ {
        access_log off;
        limit_req zone=centralcrm_login burst=5 nodelay;
        limit_req_status 429;
        include /etc/nginx/snippets/centralcrm-proxy.conf;
        proxy_pass http://127.0.0.1:8100;
    }
    location /api/v1/ {
        # OAuth callback query strings must not appear in access logs.
        access_log off;
        include /etc/nginx/snippets/centralcrm-proxy.conf;
        proxy_pass http://127.0.0.1:8100;
    }
    location /admin/ {
        access_log off;
        include /etc/nginx/snippets/centralcrm-proxy.conf;
        proxy_pass http://127.0.0.1:8100;
    }
    location / {
        include /etc/nginx/snippets/centralcrm-proxy.conf;
        proxy_pass http://127.0.0.1:3100;
    }
}
