components:
  schemas:
    Activity:
      type: object
      description: Reject spoofed read-only/unknown fields instead of silently ignoring
        them.
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        contact:
          type: string
          format: uuid
        lead:
          type: string
          format: uuid
          nullable: true
        branch:
          type: string
          format: uuid
        actor:
          type: string
          format: uuid
          readOnly: true
          nullable: true
        kind:
          allOf:
          - $ref: '#/components/schemas/ActivityKindEnum'
          readOnly: true
        body:
          type: string
          maxLength: 4000
        created_at:
          type: string
          format: date-time
          readOnly: true
        actor_name:
          type: string
          readOnly: true
        contact_name:
          type: string
          readOnly: true
        branch_name:
          type: string
          readOnly: true
      required:
      - actor
      - actor_name
      - body
      - branch_name
      - contact
      - contact_name
      - created_at
      - id
      - kind
    ActivityKindEnum:
      enum:
      - contact_created
      - contact_updated
      - identifier_added
      - lead_created
      - lead_updated
      - duplicate_resolved
      - note
      - assignment
      - sla_escalated
      - task_completed
      type: string
      description: |-
        * `contact_created` - Contact created
        * `contact_updated` - Contact updated
        * `identifier_added` - Identifier added
        * `lead_created` - Lead created
        * `lead_updated` - Lead updated
        * `duplicate_resolved` - Duplicate reviewed
        * `note` - Internal note
        * `assignment` - Lead assignment
        * `sla_escalated` - SLA escalated
        * `task_completed` - Task completed
    Ad:
      type: object
      description: Reject spoofed read-only/unknown fields instead of silently ignoring
        them.
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        branch:
          type: string
          format: uuid
        name:
          type: string
          maxLength: 150
        destination:
          type: string
          format: uri
          maxLength: 1000
        platform:
          $ref: '#/components/schemas/PlatformEnum'
        campaign_tag:
          type: string
          maxLength: 100
          pattern: ^[-a-zA-Z0-9_]+$
        notes:
          type: string
          maxLength: 1000
        tracking_url:
          type: string
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - branch
      - campaign_tag
      - created_at
      - destination
      - id
      - name
      - platform
      - tracking_url
    Attention:
      type: object
      properties:
        server_time:
          type: string
          format: date-time
        counts:
          type: object
          additionalProperties:
            type: integer
        alerts:
          type: object
          additionalProperties:
            type: array
            items:
              type: object
              additionalProperties: {}
        job:
          type: object
          additionalProperties: {}
          nullable: true
        source_results:
          type: array
          items:
            type: object
            additionalProperties: {}
      required:
      - alerts
      - counts
      - job
      - server_time
      - source_results
    AutomationCompleteInput:
      type: object
      description: Reject spoofed read-only/unknown fields instead of silently ignoring
        them.
      properties:
        resolution:
          type: string
          maxLength: 2000
      required:
      - resolution
    AutomationRuleSourceEnum:
      enum:
      - all
      - website
      - call
      - whatsapp
      - manual
      type: string
      description: |-
        * `all` - All sources
        * `website` - Website
        * `call` - Calls
        * `whatsapp` - WhatsApp
        * `manual` - Manual
    BackgroundEnum:
      enum:
      - unknown
      - student
      - working
      - job_seeker
      - other
      type: string
      description: |-
        * `unknown` - Not captured
        * `student` - Student
        * `working` - Working professional
        * `job_seeker` - Job seeker
        * `other` - Other
    Branch:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        name:
          type: string
          maxLength: 100
        code:
          type: string
          maxLength: 40
          pattern: ^[-a-zA-Z0-9_]+$
        address:
          type: string
        is_active:
          type: boolean
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - code
      - created_at
      - id
      - name
    CSRF:
      type: object
      properties:
        csrfToken:
          type: string
      required:
      - csrfToken
    Call:
      type: object
      description: Reject spoofed read-only/unknown fields instead of silently ignoring
        them.
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        branch:
          type: string
          format: uuid
        branch_name:
          type: string
          readOnly: true
        client_key:
          type: string
          maxLength: 100
        origin:
          type: string
          readOnly: true
        caller_phone:
          type: string
          maxLength: 20
        caller_name:
          type: string
          maxLength: 200
        business_phone:
          type: string
          maxLength: 20
        direction:
          $ref: '#/components/schemas/CallDirectionEnum'
        status:
          $ref: '#/components/schemas/CallStatusEnum'
        started_at:
          type: string
          format: date-time
        duration_seconds:
          type: integer
          maximum: 9223372036854775807
          minimum: 0
          format: int64
        forwarded_to:
          type: string
          maxLength: 200
        notes:
          type: string
          maxLength: 2000
        contact:
          type: string
          format: uuid
          readOnly: true
          nullable: true
        contact_name:
          type: string
          readOnly: true
          nullable: true
        contact_label:
          type: string
          readOnly: true
          nullable: true
        identity_status:
          type: string
